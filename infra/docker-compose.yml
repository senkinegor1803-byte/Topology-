name: topology

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-topology}
      POSTGRES_USER: ${POSTGRES_USER:-topology}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topology}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-topology} -d ${POSTGRES_DB:-topology}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-topology}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-topology12345}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # `mc ready local` — здоровьечек, документированный самим MinIO для
      # официального образа: https://min.io/docs/minio/container/operations/checks/healthcheck.html
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../geo
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-topology}
      POSTGRES_USER: ${POSTGRES_USER:-topology}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topology}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-topology}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-topology12345}
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgis_data:
  redis_data:
  minio_data:

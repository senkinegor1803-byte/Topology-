# Мониторинг (Шаг 5.1, п. 2): Prometheus. Интервал опроса 30 с и правило
# `for: 2m` в alerts.yml дают срабатывание оповещения о падении сервиса
# максимум через ~2.5 мин с момента отказа — с запасом укладывается в
# критерий шага «мониторинг сообщает о падении сервиса ≤ 5 мин».
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  # FastAPI отдаёт метрики через стандартный ASGI-мидлварь Prometheus
  # (`prometheus-fastapi-instrumentator` или аналог) на /metrics — само
  # подключение мидлваря в api/app.py не входит в этот проход (Шаг 5.1 —
  # инфраструктура эксплуатации, не код приложения), см. docs/ops.md.
  - job_name: topology-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Источник метрик для правила DiskSpaceLow в alerts.yml
  # (node_filesystem_avail_bytes/node_filesystem_size_bytes).
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
